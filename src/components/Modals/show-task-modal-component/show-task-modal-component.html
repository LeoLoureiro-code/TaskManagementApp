<div class="modal_container">
    <div class="show_modal_div">
        <h2 class="show_modal_title">title placeholder</h2>
        <button class="close_button" (click)="closeModal()">
            <img src="assets/icon-close.svg" alt="close icon">
        </button>
        <p class="show_modal_paragraph">
            description placeholder
        </p>

        <label for="">Subtasks</label>
        @for (subtask of Subtasks; track subtask.id) {
        <div class="subtask_item">
            <input type="checkbox" [checked]="subtask.completed" disabled>
            <span>{{ subtask.title }}</span>
        </div>
        }
        <label for="">Current Status</label>

    </div>
</div>
